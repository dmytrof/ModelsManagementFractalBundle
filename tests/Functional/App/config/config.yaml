framework:
    secret: test
    test: true
    http_method_override: false
    handle_all_throwables: true
    php_errors: { log: true }
    form: { enabled: true, csrf_protection: false }
    validation: { enabled: true }

doctrine:
    dbal:
        driver: pdo_sqlite
        memory: true
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/Entity'
                prefix: 'Dmytrof\ModelsManagementFractalBundle\Tests\Functional\App\Entity'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Dmytrof\ModelsManagementFractalBundle\Tests\Functional\App\:
        resource: '../'
        exclude: '../{Entity,config,TestKernel.php}'

    # FractalBundle services are private; public aliases keep them in the test container
    test.dmytrof_fractal.manager:
        alias: Dmytrof\FractalBundle\Service\FractalManager
        public: true
    test.dmytrof_fractal.transformers:
        alias: Dmytrof\FractalBundle\Service\TransformersContainer
        public: true
    test.dmytrof_fractal.extensions:
        alias: Dmytrof\FractalBundle\Service\ExtensionsContainer
        public: true
